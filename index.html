<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BY MORFİ — Oto Detaylandırma & Yıkama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-header h2 {
            color: #22c55e;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #22c55e;
            box-shadow: 0 0 0 0.25rem rgba(34, 197, 94, 0.25);
        }
        .btn-whatsapp {
            background-color: #22c55e;
            color: #ffffff;
            font-weight: 600;
            padding: 14px;
            border-radius: 8px;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        .btn-whatsapp:hover {
            background-color: #16a34a;
            color: #ffffff;
        }
        .btn-verify {
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
        }
        .btn-verify:hover {
            background-color: #2563eb;
        }
        label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #94a3b8;
        }
        .step-2 {
            display: none;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed #3b82f6;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card-custom">
        <div class="brand-header">
            <i class="fa-solid fa-car-wash fa-3x" style="color: #22c55e;"></i>
            <h2>BY MORFİ</h2>
            <p class="text-secondary mb-0">Oto Detaylandırma & Yıkama Randevu</p>
        </div>

        <form id="randevuFormu">
            <div id="step1">
                <div class="mb-3">
                    <label for="adSoyad"><i class="fa-solid fa-user me-1"></i> Ad Soyad</label>
                    <input type="text" class="form-control" id="adSoyad" placeholder="Adınız ve Soyadınız" required>
                </div>

                <div class="mb-3">
                    <label for="telefon"><i class="fa-solid fa-phone me-1"></i> Telefon Numarası</label>
                    <input type="tel" class="form-control" id="telefon" placeholder="05XX XXX XX XX" required>
                </div>

                <div class="mb-3">
                    <label for="aracModeli"><i class="fa-solid fa-car me-1"></i> Araç Marka / Model</label>
                    <input type="text" class="form-control" id="aracModeli" placeholder="Örn: Honda Civic" required>
                </div>

                <div class="mb-3">
                    <label for="hizmet"><i class="fa-solid fa-list-check me-1"></i> Yıkama / Bakım Türü</label>
                    <select class="form-select" id="hizmet" required>
                        <option value="" selected disabled>Hizmet Seçiniz...</option>
                        <option value="İç-Dış Yıkama">İç-Dış Yıkama</option>
                        <option value="Detaylı İç Temizlik">Detaylı İç Temizlik</option>
                        <option value="Pasta Cila & Seramik Kaplama">Pasta Cila & Seramik Kaplama</option>
                        <option value="Motor Temizliği">Motor Temizliği</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label for="tarih"><i class="fa-solid fa-calendar-days me-1"></i> Tarih</label>
                        <input type="date" class="form-control" id="tarih" required>
                    </div>
                    <div class="col-6">
                        <label for="saat"><i class="fa-solid fa-clock me-1"></i> Saat</label>
                        <input type="time" class="form-control" id="saat" required>
                    </div>
                </div>

                <button type="button" id="kodGonderBtn" class="btn-whatsapp">
                    <i class="fa-brands fa-whatsapp fa-lg me-2"></i> WhatsApp Doğrulama Kodu Al
                </button>
            </div>

            <!-- ADIM 2: KOD GİRİŞİ -->
            <div id="step2" class="step-2 text-center">
                <i class="fa-solid fa-shield-halved fa-2x text-primary mb-2"></i>
                <h5 class="text-white">Doğrulama Kodunu Girin</h5>
                <p class="small text-secondary mb-3">WhatsApp üzerinden hattınıza gönderdiğimiz 6 haneli kodu yazın.</p>
                
                <input type="text" id="girilenKod" class="form-control text-center fw-bold fs-4 mb-3" placeholder="000000" maxlength="6">
                
                <button type="button" id="onaylaBtn" class="btn-verify">
                    <i class="fa-solid fa-circle-check me-2"></i> Randevuyu Doğrula ve Tamamla
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // İŞLETME TELEFON NUMARAN (Başında 90 olacak şekilde yaz)
    const isletmeTelefonu = "905000000000";

    let uretilenKod = "";

    document.getElementById('kodGonderBtn').addEventListener('click', function() {
        const adSoyad = document.getElementById('adSoyad').value;
        const telefon = document.getElementById('telefon').value;
        const aracModeli = document.getElementById('aracModeli').value;
        const hizmet = document.getElementById('hizmet').value;
        const tarih = document.getElementById('tarih').value;
        const saat = document.getElementById('saat').value;

        if(!adSoyad || !telefon || !aracModeli || !hizmet || !tarih || !saat) {
            alert("Lütfen tüm alanları doldurun!");
            return;
        }

        // 6 Haneli Rastgele Doğrulama Kodu Üret
        uretilenKod = Math.floor(100000 + Math.random() * 900000).toString();

        // WhatsApp Mesaj Metni
        const mesaj = `Merhaba *BY MORFİ*, randevu doğrulama kodum: *${uretilenKod}*%0A%0A` +
                      `👤 *Müşteri:* ${adSoyad}%0A` +
                      `📞 *Tel:* ${telefon}%0A` +
                      `🚗 *Araç:* ${aracModeli}%0A` +
                      `🧼 *Hizmet:* ${hizmet}%0A` +
                      `📅 *Tarih:* ${tarih} - ${saat}`;

        // WhatsApp Linkini Aç
        const waURL = `https://wa.me/${isletmeTelefonu}?text=${mesaj}`;
        window.open(waURL, '_blank');

        // Adım 2'yi Ekrana Getir
        document.getElementById('step2').style.display = 'block';
        this.innerText = "Kodu Tekrar Gönder";
    });

    document.getElementById('onaylaBtn').addEventListener('click', function() {
        const girilenKod = document.getElementById('girilenKod').value.trim();

        if (girilenKod === uretilenKod && uretilenKod !== "") {
            alert("✅ Randevunuz başarıyla doğrulandı ve işletmeye iletildi!");
            location.reload();
        } else {
            alert("❌ Hatalı kod girdiniz! Lütfen WhatsApp'a düşen koda bakıp tekrar deneyin.");
        }
    });
</script>

</body>
</html>
