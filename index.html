<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BY MORFİ — Oto Detaylandırma & Yıkama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-header h2 {
            color: #22c55e;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #22c55e;
            box-shadow: 0 0 0 0.25rem rgba(34, 197, 94, 0.25);
        }
        .btn-whatsapp {
            background-color: #22c55e;
            color: #ffffff;
            font-weight: 600;
            padding: 14px;
            border-radius: 8px;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        .btn-whatsapp:hover {
            background-color: #16a34a;
            color: #ffffff;
        }
        label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card-custom">
        <div class="brand-header">
            <i class="fa-solid fa-car-wash fa-3x" style="color: #22c55e;"></i>
            <h2>BY MORFİ</h2>
            <p class="text-secondary mb-0">Oto Detaylandırma & Yıkama Randevu Sistemi</p>
        </div>

        <form id="randevuFormu">
            <div class="mb-3">
                <label for="adSoyad"><i class="fa-solid fa-user me-1"></i> Ad Soyad</label>
                <input type="text" class="form-control" id="adSoyad" placeholder="Adınız ve Soyadınız" required>
            </div>

            <div class="mb-3">
                <label for="telefon"><i class="fa-solid fa-phone me-1"></i> Telefon Numarası</label>
                <input type="tel" class="form-control" id="telefon" placeholder="05XX XXX XX XX" required>
            </div>

            <div class="mb-3">
                <label for="aracModeli"><i class="fa-solid fa-car me-1"></i> Araç Marka / Model</label>
                <input type="text" class="form-control" id="aracModeli" placeholder="Örn: Honda Civic, BMW 320" required>
            </div>

            <div class="mb-3">
                <label for="hizmet"><i class="fa-solid fa-list-check me-1"></i> Yıkama / Bakım Türü</label>
                <select class="form-select" id="hizmet" required>
                    <option value="" selected disabled>Hizmet Seçiniz...</option>
                    <option value="İç-Dış Yıkama">İç-Dış Yıkama</option>
                    <option value="Detaylı İç Temizlik">Detaylı İç Temizlik</option>
                    <option value="Pasta Cila & Seramik Kaplama">Pasta Cila & Seramik Kaplama</option>
                    <option value="Motor Temizliği">Motor Temizliği</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="tarih"><i class="fa-solid fa-calendar-days me-1"></i> Tarih</label>
                    <input type="date" class="form-control" id="tarih" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="saat"><i class="fa-solid fa-clock me-1"></i> Saat</label>
                    <input type="time" class="form-control" id="saat" required>
                </div>
            </div>

            <button type="submit" class="btn-whatsapp mt-2">
                <i class="fa-brands fa-whatsapp fa-lg me-2"></i> WhatsApp ile Randevu Oluştur
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('randevuFormu').addEventListener('submit', function(e) {
        e.preventDefault();

        // TELEFON NUMARANI BURAYA YAZ (Ülke kodu ile, başında + olmadan)
        const isletmeTelefonu = "905000000000"; 

        const adSoyad = document.getElementById('adSoyad').value;
        const telefon = document.getElementById('telefon').value;
        const aracModeli = document.getElementById('aracModeli').value;
        const hizmet = document.getElementById('hizmet').value;
        const tarih = document.getElementById('tarih').value;
        const saat = document.getElementById('saat').value;

        // WhatsApp Mesaj Metni
        const mesaj = `Merhaba *BY MORFİ*, yeni bir randevu talebim var:%0A%0A` +
                      `👤 *Müşteri:* ${adSoyad}%0A` +
                      `📞 *Telefon:* ${telefon}%0A` +
                      `🚗 *Araç:* ${aracModeli}%0A` +
                      `🧼 *Hizmet:* ${hizmet}%0A` +
                      `📅 *Tarih:* ${tarih}%0A` +
                      `⏰ *Saat:* ${saat}`;

        // WhatsApp Linki Oluştur ve Yönlendir
        const whatsappURL = `https://wa.me/${isletmeTelefonu}?text=${mesaj}`;
        window.open(whatsappURL, '_blank');
    });
</script>

</body>
</html>
